name: beauty-wellness-local
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copia .env.example a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD local}
      POSTGRES_DB: ${POSTGRES_DB:-beauty_wellness_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: "no"
  postgres-test:
    profiles: [test]
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: bw_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Define POSTGRES_TEST_PASSWORD local}
      POSTGRES_DB: beauty_wellness_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55433}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: "no"
volumes:
  postgres_data:
  postgres_test_data:
